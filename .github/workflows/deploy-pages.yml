name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'vision-*.jpg'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # リポジトリ全体（SNSメディア等）は上げず、ダッシュボードだけ公開する
      - name: Prepare Pages bundle
        run: |
          mkdir -p _site
          cp dashboard.html _site/dashboard.html
          cp dashboard.html _site/index.html
          cp vision-*.jpg _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 直前デプロイの取消直後は競合しやすいので少し待ってから公開。失敗時は1回リトライ。
      - name: Wait for previous deployment lock
        run: sleep 30
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deploy if needed
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Ensure deployment succeeded
        if: always() && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: |
          echo "GitHub Pages deploy failed"
          exit 1
